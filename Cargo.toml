[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/security",
    "crates/transfer-core",
    "crates/discovery",
    "crates/transfer-store",
    "crates/bolt-cli",
    "crates/bolt-android",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
blake3 = "1"
rand = "0.9"
hex = "0.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
